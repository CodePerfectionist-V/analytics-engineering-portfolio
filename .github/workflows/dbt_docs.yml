name: generate-dbt-docs

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and Deploy dbt Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery

      - name: Authenticate Google Cloud Service Account
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cat << EOF > ~/.dbt/profiles.yml
          ae_jaffle_shop:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                keyfile: ${{ steps.auth.outputs.credentials_file_path }}
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: jaffle_shop
                threads: 4
                timeout_seconds: 300
                priority: interactive
          EOF

      - name: Run dbt deps and generate docs
        working-directory: ./ae_jaffle_shop
        run: |
          dbt deps
          dbt docs generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ae_jaffle_shop/target