version: 2

models:
  - name: stg_jaffle_shop__customers
    description: Staged customer records cleaned from the raw jaffle_shop source.
    columns:
      - name: customer_id
        description: Primary key for customers.
        tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name.

      - name: last_name
        description: Customer's last name.

  - name: stg_jaffle_shop__orders
    description: Staged order transactions cleaned from the raw jaffle_shop source.
    columns:
      - name: order_id
        description: Primary key for orders.
        tests:
          - unique
          - not_null

      - name: customer_id
        description: Foreign key referencing stg_jaffle_shop__customers.customer_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

      - name: order_date
        description: Timestamp when the order was placed.

      - name: order_status
        description: Current status of the order (e.g., placed, shipped, completed).

  - name: stg_jaffle_shop__payments
    description: Staged payment transactions cleaned from the raw stripe source.
    columns:
      - name: payment_id
        description: Primary key for payments.
        tests:
          - unique
          - not_null

      - name: order_id
        description: Foreign key referencing stg_jaffle_shop__orders.order_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__orders')
                field: order_id

      - name: payment_method
        description: Method used to complete the payment (e.g., credit_card, coupon).

      - name: payment_status
        description: Status of the payment transaction (e.g., success, fail).

      - name: amount_usd
        description: Total payment amount converted from cents to USD.
        tests:
          - not_null